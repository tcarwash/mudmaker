[project]
name = "mudmaker"
version = "0.2.0"
description = "A browser based workbench for designing and exporting SSH key authenticated MUDs"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111,<1", "uvicorn[standard]>=0.30,<1", "asyncssh==2.21.0", "mcp==1.30.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "playwright>=1.50,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
